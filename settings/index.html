<!doctype html>
<html>
	<head>
		<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
		<script type="text/javascript" src="settings.js" data-origin="settings"></script>
	</head>
	<body>
		<header class="homey-header">
			<h1 class="homey-title" data-i18n="settings.tab1.title">Instructions</h1>
		</header>

		<div>
			<button id="tabb1" class="homey-button-primary" onclick="showTab(1)" data-i18n="settings.tab1.title">Instructions</button>
			<button id="tabb3" class="homey-button-secondary" onclick="showTab(3)" data-i18n="settings.tab3.title">Settings</button>
			<button id="tabb4" class="homey-button-secondary" onclick="showTab(4)" data-i18n="settings.tab4.title">Manage Faces</button>
			<button id="tabb5" class="homey-button-secondary" onclick="showTab(5)" data-i18n="settings.tab5.title">Manage cloud</button>
			<button id="tabb2" class="homey-button-secondary" onclick="showTab(2)" data-i18n="settings.tab2.title">Log</button>
		</div>

		<!-- Instructions panel -->
		<div id="tab1">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.warningTitle">WARNING</legend>
				<p data-i18n="settings.tab1.warningInstructions">Instructions</p>
			</fieldset>
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.registerTitle">Register</legend>
				<p data-i18n="settings.tab1.registerInstructions">Instructions</p>
			</fieldset>
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.manageTitle">Manage</legend>
				<p data-i18n="settings.tab1.manageInstructions">Instructions</p>
			</fieldset>
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab1.useTitle">Use</legend>
				<p data-i18n="settings.tab1.useInstructions">Instructions</p>
			</fieldset>
		</div>

		<!-- Settings panel -->
		<div id="tab3" style="display: none;">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab3.instructionsLegendKey">API Key</legend>
				<p data-i18n="settings.tab3.instructionsKey">Instructions</p>

				<div class="homey-form-group">
					<label class="homey-form-label" for="apiKey" data-i18n="settings.tab3.api_key">API Key</label>
					<input class="homey-form-input" id="apiKey" type="text" value="">
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="apiSecret" data-i18n="settings.tab3.api_secret">API Secret</label>
					<div style="display: flex; gap: 8px;">
						<input class="homey-form-input" id="apiSecret" type="password" value="">
						<button type="button" class="homey-button-secondary" onclick="togglePasswordView()">&#128065;</button>
					</div>
				</div>
				<button id="saveSettingsKey" class="homey-button-primary-full" onclick="saveSettingsKey()" data-i18n="settings.tab3.saveSettingsKey">Save API Key</button>
			</fieldset>

			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab3.instructionsLegendMatch">FACE MATCH</legend>
				<p data-i18n="settings.tab3.instructionsMatch">Instructions</p>

				<div class="homey-form-group">
					<label class="homey-form-label" for="threshold" data-i18n="settings.tab3.threshold">MATCH THRESHOLD</label>
					<input class="homey-form-input" id="threshold" type="number" min="1" max="100" value="70">
				</div>
				<button id="saveSettingsMatch" class="homey-button-primary-full" onclick="saveSettingsMatch()" data-i18n="settings.tab3.saveSettingsMatch">SAVE MATCH SETTINGS</button>
			</fieldset>

			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab3.instructionsLegendCrop">FACE CROP</legend>
				<p data-i18n="settings.tab3.instructionsCrop">Instructions</p>

				<div class="homey-form-group">
					<label class="homey-form-label" for="cropEnabled" data-i18n="settings.tab3.cropEnabled">Include a face snapshot in the trigger</label>
					<input type="checkbox" id="cropEnabled" checked>
				</div>
				<button id="saveSettingsCrop" class="homey-button-primary-full" onclick="saveSettingsCrop()" data-i18n="settings.tab3.saveSettingsCrop">SAVE FACE CROP SETTINGS</button>
			</fieldset>
		</div>

		<!-- Manage Faces panel -->
		<div id="tab4" style="display: none;">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab4.instructionsLegend">Instructions</legend>
				<p data-i18n="settings.tab4.instructions">Instructions</p>

				<div class="homey-form-group">
					<label class="homey-form-label" for="faceList" data-i18n="settings.tab4.select">SELECT</label>
					<select class="homey-form-select" id="faceList" onchange="faceSelected()"></select>
				</div>

				<div class="homey-form-group">
					<label class="homey-form-label" for="label" data-i18n="settings.tab4.label">LABEL</label>
					<input class="homey-form-input" id="label" type="text" value="" placeholder="enter name">
				</div>

				<div class="homey-form-group">
					<input id="file" type="file" accept="image/*" name="image" onchange="loadFile(event)">
				</div>
				<p><img id="preview" height="200" /></p>

				<div class="homey-form-group">
					<label class="homey-form-label" for="faceToken" data-i18n="settings.tab4.faceToken">FACE TOKEN</label>
					<input class="homey-form-input" id="faceToken" type="text" value="" readonly>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="facequality" data-i18n="settings.tab4.facequality">FACE QUALITY</label>
					<input class="homey-form-input" id="facequality" type="number" readonly>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="gender" data-i18n="settings.tab4.gender">GENDER</label>
					<input class="homey-form-input" id="gender" type="text" value="" readonly>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="age" data-i18n="settings.tab4.age">AGE</label>
					<input class="homey-form-input" id="age" type="number" readonly>
				</div>
				<div class="homey-form-group">
					<label class="homey-form-label" for="glass" data-i18n="settings.tab4.glass">GLASS</label>
					<input class="homey-form-input" id="glass" type="text" readonly>
				</div>

				<button id="saveFace" class="homey-button-primary" onclick="saveFace()" data-i18n="settings.tab4.saveFace">SAVE</button>
				<button id="deleteFace" class="homey-button-danger" onclick="deleteFace()" data-i18n="settings.tab4.deleteFace">DELETE</button>
			</fieldset>
		</div>

		<!-- Manage cloud panel -->
		<div id="tab5" style="display: none;">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab5.legendThisHomey">This Homey</legend>
				<p data-i18n="settings.tab5.instructionsThisHomey">Instructions</p>
				<div id="thisHomeyRow"></div>
			</fieldset>
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab5.legendOtherHomeys">Other Homeys</legend>
				<p data-i18n="settings.tab5.instructionsOtherHomeys">Instructions</p>
				<div id="foreignFacesetsList"></div>
			</fieldset>
		</div>

		<!-- Logging panel -->
		<div id="tab2" style="display: none;">
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.tab2.title">Log</legend>

				<div class="homey-form-group">
					<label class="homey-form-checkbox">
						<input type="checkbox" id="show_logs" checked onchange="updateLogs()">
						<span data-i18n="settings.tab2.showLogs">Show logs</span>
					</label>
					<label class="homey-form-checkbox">
						<input type="checkbox" id="show_errors" checked onchange="updateLogs()">
						<span data-i18n="settings.tab2.showErrors">Show errors</span>
					</label>
					<label class="homey-form-checkbox">
						<input type="checkbox" id="show_no_detections" checked onchange="updateLogs()">
						<span data-i18n="settings.tab2.showNoDetections">Show 'no faces found'</span>
					</label>
				</div>

				<button id="deleteButton" class="homey-button-danger" onclick="deleteLogs()" data-i18n="settings.tab2.deletelogs">Delete logs</button>
				<pre id="loglines"></pre>
			</fieldset>
		</div>
	</body>
</html>
